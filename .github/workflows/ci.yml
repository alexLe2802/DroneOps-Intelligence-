name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production deployment halfway through publishing assets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Disposable runner service only. Never inject team Supabase credentials here.
      DRONEOPS_CI_ISOLATED: "true"
      DRONEOPS_CI_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=ci-local-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected suites
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci/test_changes.py
          python3 -m unittest discover -s scripts/ci -p 'test_cloudflare_auth.py'
          python3 scripts/ci/changes.py
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.changes.outputs.backend == 'true'
        with:
          dotnet-version: 8.0.x
      - name: Backend — build once and run essential regression suites
        if: steps.changes.outputs.backend == 'true'
        run: |
          dotnet restore be/DroneOps/DroneOps.sln
          dotnet build be/DroneOps/DroneOps.sln -c Release --no-restore -warnaserror
          dotnet run --project be/DroneOps/DroneOps.AuthChecks -c Release --no-build
          for suite in automatic-flight-policy mission-compiler mission-schedule mission-history mission-geometry mission-fences automatic-failsafe recovery-energy; do
            dotnet run --project be/DroneOps/DroneOps.AuthChecks -c Release --no-build -- "--$suite"
          done
          dotnet run --project be/DroneOps/DroneOps.TelemetryChecks -c Release --no-build
          dotnet run --project be/DroneOps/DroneOps.PostFlightChecks -c Release --no-build
      - name: Supabase — PostgreSQL migration compatibility and concurrent workflow
        if: steps.changes.outputs.backend == 'true'
        run: |
          dotnet run --project be/DroneOps/DroneOps.AuthChecks -c Release --no-build -- --ci-migrations "$GITHUB_WORKSPACE"
          dotnet run --project be/DroneOps/DroneOps.AuthChecks -c Release --no-build -- --mission-workflow-postgres
          dotnet run --project be/DroneOps/DroneOps.AuthChecks -c Release --no-build -- --license-workflow "$GITHUB_WORKSPACE"
      - name: Enable verified TLS for the disposable PostgreSQL service
        if: steps.changes.outputs.backend == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/ci/postgres_tls.py
      - name: Render — validate Blueprint, build image and smoke test
        if: steps.changes.outputs.backend == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        env:
          DRONEOPS_CI_KEEP_API: ${{ steps.changes.outputs.frontend }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
          "$RUNNER_TEMP/ci-tools/bin/python" scripts/ci/render_smoke.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Frontend — lint, types and offline tests
        if: steps.changes.outputs.frontend == 'true'
        working-directory: fe
        env:
          DRONEOPS_CI: "true"
        run: |
          npm ci
          npm run lint -- --max-warnings=0
          npm run typecheck
          npm test
      - name: Cloudflare — optional deployment build
        if: steps.changes.outputs.frontend == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        working-directory: fe
        env:
          DRONEOPS_CI: "true"
        run: |
          npm run build:vinext
          npx --no-install cf workers versions create --dry-run --prebuilt
      - name: Cloudflare — smoke test local Worker runtime
        if: steps.changes.outputs.frontend == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        env:
          DRONEOPS_CI_BACKEND_READY: ${{ steps.changes.outputs.backend }}
        run: python3 scripts/ci/cloudflare_smoke.py
      - name: Gateway — offline checks, without flight controller
        if: steps.changes.outputs.gateway == 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r gateway/requirements.txt
          PYTHONPATH=gateway .venv/bin/python -m unittest discover -s gateway -p 'test_*.py'
      - name: ArduCopter — conditional SITL policy read-back
        if: steps.changes.outputs.sitl == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          curl --fail --location --retry 2 --max-time 90 \
            https://firmware.ardupilot.org/Copter/stable-4.7.1/SITL_x86_64_linux_gnu/arducopter \
            --output "$RUNNER_TEMP/arducopter-4.7.1"
          chmod 700 "$RUNNER_TEMP/arducopter-4.7.1"
          PYTHONPATH=gateway .venv/bin/python gateway/sitl_arducopter47.py --binary "$RUNNER_TEMP/arducopter-4.7.1"
          PYTHONPATH=gateway .venv/bin/python gateway/sitl_arducopter47.py --binary "$RUNNER_TEMP/arducopter-4.7.1" --policy-version multicopter-envelope-v2
      - name: Clean up isolated API container
        if: always() && steps.changes.outputs.backend == 'true'
        run: docker rm --force droneops-ci-api >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pr-ci-runtime-logs
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/droneops-render-ci.log
            ${{ runner.temp }}/droneops-cloudflare-ci.log
      - name: Result summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "### PR Quality Gate: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Quality gate: affected offline suites and disposable PostgreSQL migration/workflow checks. Add full-ci label for Render Docker/TLS smoke, Cloudflare build/runtime and relevant SITL. Omitted checks are not reported as passed. This job makes no hosted Supabase writes, production deployment or real flight. Main pushes deploy Cloudflare in the separate production job after this gate succeeds.' >> "$GITHUB_STEP_SUMMARY"

  cloudflare-production:
    name: Deploy Cloudflare production
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: fe
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Verify Cloudflare token and Worker account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 ../scripts/ci/cloudflare_auth.py
      - name: Install locked dependencies
        run: npm ci
      - name: Build with production domains and backend
        env:
          # The quality gate uses a separate build with localhost bindings.
          DRONEOPS_CI: "false"
        run: npm run build:vinext
      - name: Skip superseded commits
        id: latest
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(curl --fail --silent --show-error --retry 3 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])')
          if [ "$main_sha" = "$RELEASE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "Skipped superseded commit $RELEASE_SHA; main is now $main_sha." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy Worker and custom domains
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRONEOPS_CI: "false"
          RELEASE_SHA: ${{ github.sha }}
        run: npx --no-install cf deploy --prebuilt --tag "$RELEASE_SHA" --message "GitHub Actions main $RELEASE_SHA"
      - name: Verify production pages
        if: steps.latest.outputs.deploy == 'true'
        run: |
          for origin in https://droneops.click https://www.droneops.click; do
            for path in / /login; do
              status=$(curl --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 --output /dev/null --write-out '%{http_code}' "$origin$path")
              if [ "$status" != 200 ]; then
                echo "::error::Production verification failed: $origin$path returned HTTP $status"
                exit 1
              fi
            done
          done
      - name: Record deployed commit
        if: steps.latest.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "Deployed main commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker: droneops-web; domains: https://droneops.click and https://www.droneops.click. Public landing/login checks passed; authenticated user flows were not exercised.' >> "$GITHUB_STEP_SUMMARY"
