name: CI

on:
  pull_request:
  push:
    branches: [main, be-develop, Qthong]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Restore .NET dependencies
        run: dotnet restore be/DroneOps/DroneOps.sln
      - name: Build Release (warnings are errors)
        run: dotnet build be/DroneOps/DroneOps.sln --configuration Release --no-restore -warnaserror
      - name: Check .NET analyzer diagnostics
        run: dotnet format analyzers be/DroneOps/DroneOps.sln --no-restore --verify-no-changes --severity warn
      - name: Run offline authorization and validation checks
        run: dotnet run --project be/DroneOps/DroneOps.AuthChecks --configuration Release --no-build --no-restore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Lint (warnings are errors)
        run: npm run lint -- --max-warnings=0
      - name: Check TypeScript and Next.js route types
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build Next.js production application
        run: npm run build

  quality-gate:
    name: PR Quality Gate
    if: ${{ always() }}
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both jobs to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          echo "Backend: $BACKEND_RESULT"
          echo "Frontend: $FRONTEND_RESULT"
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
