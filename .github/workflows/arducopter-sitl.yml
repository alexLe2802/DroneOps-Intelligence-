name: ArduCopter 4.7.1 SITL

on:
  workflow_dispatch:
  push:
    branches: [main, Qthong]
    paths:
      - 'gateway/arducopter47_adapter.py'
      - 'gateway/sitl_arducopter47.py'
      - 'gateway/envelope_verifier.py'
      - 'gateway/flight_control.py'
      - '.github/workflows/arducopter-sitl.yml'

permissions:
  contents: read

jobs:
  parameter-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r gateway/requirements.txt
      - name: Download official ArduCopter 4.7.1 SITL binary
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            https://firmware.ardupilot.org/Copter/stable-4.7.1/SITL_x86_64_linux_gnu/arducopter \
            --output /tmp/droneops-arducopter-4.7.1
          chmod 700 /tmp/droneops-arducopter-4.7.1
      - name: Apply and independently read back FC policy in SITL
        run: |
          PYTHONPATH=gateway .venv/bin/python gateway/sitl_arducopter47.py --binary /tmp/droneops-arducopter-4.7.1
          PYTHONPATH=gateway .venv/bin/python gateway/sitl_arducopter47.py --binary /tmp/droneops-arducopter-4.7.1 --policy-version multicopter-envelope-v2
